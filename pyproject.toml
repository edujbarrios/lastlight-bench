[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastlight-bench"
version = "0.1.0"
description = "Reproducible quality and efficiency benchmark for LastLight"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
dependencies = ["lastlight==0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
lastlight-bench = "lastlight_bench.cli:main"
lastlight-bench-suite = "lastlight_bench.suite:main"
lastlight-bench-gate = "lastlight_bench.gates:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

